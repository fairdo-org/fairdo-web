<!DOCTYPE html>
<html lang="en">
<script>
    // Mobile nav toggle
     const toggle = document.getElementById('nav-toggle');
     const menu   = document.getElementById('nav-menu');
     const nav    = document.getElementById('main-nav');

     toggle?.addEventListener('click', () => {
       menu.classList.toggle('is-open');
       toggle.classList.toggle('is-active');
     });

     // Sticky nav on scroll
     window.addEventListener('scroll', () => {
       nav.classList.toggle('nav--scrolled', window.scrollY > 50);
     });

     // Dropdown — only handle clicks on mobile
     // On desktop, CSS :hover handles everything
     document.querySelectorAll('.nav__item--dropdown > .nav__link').forEach(link => {
       link.addEventListener('click', e => {
         if (window.innerWidth < 1024) {
           e.preventDefault();
           const item = link.closest('.nav__item--dropdown');
           // close all other open dropdowns first
           document.querySelectorAll('.nav__item--dropdown.is-open').forEach(el => {
             if (el !== item) el.classList.remove('is-open');
           });
           item.classList.toggle('is-open');
         }
       });
     });

     // Nested dropdowns — toggle on mobile click
     document.querySelectorAll('.nav__dropdown-item--parent > .nav__dropdown-link').forEach(link => {
       link.addEventListener('click', e => {
         if (window.innerWidth < 1024) {
           e.preventDefault();
           const item = link.closest('.nav__dropdown-item--parent');
           document.querySelectorAll('.nav__dropdown-item--parent.is-open').forEach(el => {
             if (el !== item) el.classList.remove('is-open');
           });
           item.classList.toggle('is-open');
         }
       });
     });

     // Close dropdown when clicking outside
     document.addEventListener('click', e => {
       if (!e.target.closest('.nav__item--dropdown')) {
         document.querySelectorAll('.nav__item--dropdown.is-open').forEach(el => {
           el.classList.remove('is-open');
         });
       }
     });

     // Close mobile menu when clicking a link
     document.querySelectorAll('.nav__link, .nav__dropdown-link').forEach(link => {
       link.addEventListener('click', () => {
         if (window.innerWidth < 1024) {
           menu.classList.remove('is-open');
           toggle.classList.remove('is-active');
         }
       });
     });
     
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}</title>
    {{ partial "head.html" . }}
</head>
<body>
    {{ partial "header.html" . }}
<main id="main-content">
    {{ block "main" . }}{{ end }}
</main>
    {{ partial "footer.html" . }}
</body>
</html>
