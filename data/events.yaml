- date: "2026-10-02"
  sortDate: "2026-10-02"
  time: "14:30 CEST"
  title: "Conceiving an Architecture of Trust"
  location: "Online"
  category: "Workshop"
  description: "Speakers: Paolo Budroni, Peter Wittenburg; The current practices can’t be continued since they will hamper making AI a commodity and addressing UN’s Sustainable Development Goals. A framework is required that also takes into account the different views and interests, that addresses sovereignty, transparency, traceability, accountability and persistence."

