- date: "2026-30-10"
  sortDate: "2026-30-10"
  time: "14:30 CEST"
  title: "FDO Specifications 2026"
  location: "Online"
  category: "Workshop"
  description: "Speakers: Sven Bingert, Jana Böhm, Maximilian Inckmann; During the last year, the FDO specifications underwent a major reorganization: from a collection of official notes to one consolidated and harmonized W3C-style specification document. These updated specifications are built on five years of practical experience in creating, managing, and utilizing FDOs across various projects."



